apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-events
  labels:
    app: college-events
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-events
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: college-events
    spec:
      containers:
        - name: college-events
          image: raghavendrasaladi/agilenew3:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
